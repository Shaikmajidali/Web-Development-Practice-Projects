<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple To-Do List</title>
<style>
  /* Basic page styling */
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    display: flex;
    justify-content: center;
    padding-top: 50px;
  }

  /* The main box holding the to-do list */
  .container {
    background: #fff;
    padding: 20px 25px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    width: 350px;
  }

  h2 {
    text-align: center;
    margin-top: 0;
  }

  /* Input row: text box + add button */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
  }

  #taskInput {
    flex: 1;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }

  #addBtn {
    padding: 8px 14px;
    border: none;
    background: #4CAF50;
    color: white;
    border-radius: 4px;
    cursor: pointer;
  }

  #addBtn:hover {
    background: #43a047;
  }

  /* Task list */
  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
  }

  /* Strike through text when task is completed */
  li.completed span {
    text-decoration: line-through;
    color: #999;
  }

  li span {
    flex: 1;
    margin-left: 8px;
    cursor: pointer;
  }

  .delete-btn {
    background: none;
    border: none;
    color: #e53935;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="container">
  <h2>My To-Do List</h2>

  <!-- Input field and button to add new tasks -->
  <div class="input-row">
    <input type="text" id="taskInput" placeholder="Enter a task...">
    <button id="addBtn">Add</button>
  </div>

  <!-- Task list will be added here by JavaScript -->
  <ul id="taskList"></ul>
</div>

<script>
  // Get references to the HTML elements we need
  const taskInput = document.getElementById("taskInput");
  const addBtn = document.getElementById("addBtn");
  const taskList = document.getElementById("taskList");

  // Function to add a new task
  function addTask() {
    const taskText = taskInput.value.trim(); // remove extra spaces

    // Don't add empty tasks
    if (taskText === "") {
      return;
    }

    // Create a new list item
    const li = document.createElement("li");

    // Create the text part of the task
    const span = document.createElement("span");
    span.textContent = taskText;

    // Clicking the text toggles "completed" (strikethrough)
    span.addEventListener("click", function () {
      li.classList.toggle("completed");
    });

    // Create the delete button
    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "✕";
    deleteBtn.className = "delete-btn";

    // Clicking delete removes the task from the list
    deleteBtn.addEventListener("click", function () {
      li.remove();
    });

    // Put the text and delete button inside the list item
    li.appendChild(span);
    li.appendChild(deleteBtn);

    // Add the list item to the task list
    taskList.appendChild(li);

    // Clear the input box for the next task
    taskInput.value = "";
  }

  // Add task when the "Add" button is clicked
  addBtn.addEventListener("click", addTask);

  // Add task when "Enter" key is pressed inside the input box
  taskInput.addEventListener("keypress", function (event) {
    if (event.key === "Enter") {
      addTask();
    }
  });
</script>

</body>
</html>
