<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧮</title>
    <link rel="stylesheet" href="Calculator.css">
</head>
<body>
    <div id="h1"><h1>Calculator</h1></div>
    
    <div id="Box">
         <input type="text" id="Display" class="input">

         <button class="c" onclick="currentDisplay='';
         document.querySelector('#Display').value=currentDisplay">C</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '1';
         document.querySelector('#Display').value=currentDisplay">1</button>

        <button class="click" onclick="currentDisplay = currentDisplay + '2';
        document.querySelector('#Display').value=currentDisplay">2</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '3';
         document.querySelector('#Display').value=currentDisplay">3</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '4';
         document.querySelector('#Display').value=currentDisplay">4</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '5';
         document.querySelector('#Display').value=currentDisplay">5</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '6';
         document.querySelector('#Display').value=currentDisplay">6</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '7';
         document.querySelector('#Display').value=currentDisplay">7</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '8';
         document.querySelector('#Display').value=currentDisplay">8</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '9';
         document.querySelector('#Display').value=currentDisplay">9</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '0';
         document.querySelector('#Display').value=currentDisplay">0</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '.';
         document.querySelector('#Display').value=currentDisplay">.</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '+';
         document.querySelector('#Display').value=currentDisplay">+</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '-';
         document.querySelector('#Display').value=currentDisplay">-</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '%';
         document.querySelector('#Display').value=currentDisplay">%</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '*';
         document.querySelector('#Display').value=currentDisplay">*</button>

         <button class="click" onclick="currentDisplay = currentDisplay + '/';
         document.querySelector('#Display').value=currentDisplay">/</button>

         <button class="click" onclick="let result=eval(currentDisplay);
          currentDisplay=result;
         document.querySelector('#Display').value=currentDisplay">=</button>
         
    </div>
     
   
</body>
</html>
